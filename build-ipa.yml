name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor & Generate iOS Project
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned .app with Xcode
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj             -scheme App             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO              clean build

      - name: Package Payload into .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r MergeStudio-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MergeStudio-Unsigned-IPA
          path: MergeStudio-Unsigned.ipa
